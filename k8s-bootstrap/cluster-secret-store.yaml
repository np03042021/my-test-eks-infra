# Cluster-wide store backed by AWS Secrets Manager.
# No auth block = no static credentials: ESO uses its own EKS Pod Identity role, which can read only spr/demo.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  # A ClusterSecretStore is usable from ANY namespace by default. Restrict it to the app namespace
  # so a workload in another namespace can't create an ExternalSecret that copies spr/demo out.
  conditions:
    - namespaces:
        - spr-app
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
